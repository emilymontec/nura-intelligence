events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream frontend {
        server frontend:5173;
    }

    upstream backend {
        server chat-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Rutas de la API → Django Backend.
        # Antes todo vivía bajo /api/; ahora los endpoints son de recurso
        # directo (/chat/, /auth/, /sessions/, etc.), así que hay que listar
        # cada prefijo del backend explícitamente para no capturar por error
        # rutas del frontend (p. ej. /console, /asistente).
        location ~ ^/(admin|accounts|auth|chat|analyze|test|sessions|profile|workspace|datasets|tags|categories)(/|$) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /static/;
            expires 30d;
        }

        # Todo lo demás → Frontend (React + Vite)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
