services:
  # Base de datos PostgreSQL para el servicio de chat
  postgres-chat:
    image: postgres:15-alpine
    container_name: nura-postgres-chat
    environment:
      POSTGRES_USER: nura_chat
      POSTGRES_PASSWORD: nura_chat_password
      POSTGRES_DB: nura_chat_db
    volumes:
      - postgres-chat-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nura_chat -d nura_chat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis: broker de Celery (Módulo 2 - procesamiento asíncrono)
  redis:
    image: redis:7-alpine
    container_name: nura-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservicio de Chat (Django)
  chat-service:
    build:
      context: ..
      dockerfile: Dockerfile.chat
    container_name: nura-chat-service
    ports:
      - "8001:8000"
    environment:
      - DJANGO_SECRET_KEY=unsafe-secret-key-for-dev-only-change-me
      - DJANGO_DEBUG=True
      - DATABASE_URL=postgres://nura_chat:nura_chat_password@postgres-chat:5432/nura_chat_db
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
    depends_on:
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ..:/app
    working_dir: /app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Worker de Celery: procesa el análisis de datasets en segundo plano
  celery-worker:
    build:
      context: ..
      dockerfile: Dockerfile.chat
    container_name: nura-celery-worker
    environment:
      - DJANGO_SECRET_KEY=unsafe-secret-key-for-dev-only-change-me
      - DATABASE_URL=postgres://nura_chat:nura_chat_password@postgres-chat:5432/nura_chat_db
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
    depends_on:
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ..:/app
    working_dir: /app
    command: celery -A nura worker --loglevel=info

  # Gateway (Nginx)
  gateway:
    image: nginx:alpine
    container_name: nura-gateway
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../staticfiles:/static:ro
    depends_on:
      - chat-service

  # Frontend (React + Vite) - Solo para desarrollo, usa build en producción
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nura-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - gateway

volumes:
  postgres-chat-data:
